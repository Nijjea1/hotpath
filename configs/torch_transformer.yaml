# Dryft-style GPU target. Requires torch. planner/worker default to mock; switch to openai for a real search.
name: torch_transformer
target: ../targets/torch_transformer
test_cmd: python tests/check.py
bench_cmd: python bench.py
profile_cmd: python hotprofile.py
editable: ["model.py", "kernels/*.py"]
locked: ["tests/*", "bench.py", "hotprofile.py"]
timeouts: {test: 600, bench: 1200, profile: 300, model: 180}
benchmark: {min_speedup: 1.03, noise_multiplier: 2.0, baseline_repeats: 3, exclusive: true, rebenchmark_parent: true, required_workloads: [p32_b1, p32_b2, p160_b1, p160_b2], min_workload_retention: 0.98}
search: {iterations: 4, candidates_per_iteration: 3, max_parallel_tests: 2, max_parallel_workers: 4, max_parallel_benchmarks: 1}
strategies:
  - "gpu: preallocate the KV cache to max length and write into it in place instead of torch.cat"
  - "gpu: remove the .tolist() CPU sync from token selection; keep the next token on device"
  - "gpu: compute the causal mask once per step instead of torch.tril each forward"
  - "gpu: use F.scaled_dot_product_attention for the attention math"
  - "gpu: use backend-portable torch.compile when supported and keep eager fallback"
  - "gpu kernel: write a Triton kernel in kernels/ for CUDA or ROCm, dispatch only when its dtype/shape/stride preconditions hold, and retain the PyTorch fallback"
  - "apple gpu: prefer MPS-supported fused PyTorch operations and retain CPU fallback for unsupported operators"
provider:
  planner: mock
  worker: mock
  mock_patches_dir: ../targets/torch_transformer/mock_patches

# Trusted bundled demo only; use the Docker config for arbitrary repositories.
execution: {backend: local}
