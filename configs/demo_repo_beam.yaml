# Offline demo that exercises the dashboard's harder cases in one run, with no API keys:
# beam_width 2 produces branching and not_selected siblings, max_patch_retries 1 produces a retry
# chain, and profile.retain keeps enough hotspots for the before/after bottleneck diff to bound
# absences instead of claiming eliminations.
name: demo_repo_beam
target: ../demo_repo
test_cmd: python tests/check.py
bench_cmd: python bench.py
profile_cmd: python hotprofile.py
editable: ["*.py"]
locked: ["tests/*", "bench.py", "hotprofile.py", "data.py"]
timeouts: {test: 120, bench: 300, profile: 120, model: 120}
benchmark: {min_speedup: 1.03, noise_multiplier: 2.0, baseline_repeats: 3, bootstrap_samples: 1500}
search: {iterations: 3, candidates_per_iteration: 3, max_parallel_tests: 2, max_parallel_workers: 4,
         max_parallel_benchmarks: 1, beam_width: 2, max_patch_retries: 1}
profile: {retain: 40}
provider:
  planner: mock
  worker: mock
  mock_patches_dir: ../demo_repo/mock_patches

# Trusted bundled demo only; use the Docker config for arbitrary repositories.
execution: {backend: local}
