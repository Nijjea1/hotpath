[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hotpath-agent"
version = "0.1.0"
description = "An AI agent that makes code faster and proves every change is correct."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hotpath contributors" }]
keywords = ["performance", "profiling", "benchmarking", "ai", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "openai>=1.40",
  "sentry-sdk[fastapi]>=2.69.2,<3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "build>=1.2", "ruff>=0.15"]
torch = ["torch>=2.2"]

[project.urls]
Homepage = "https://github.com/Nijjea1/hotpath"
Repository = "https://github.com/Nijjea1/hotpath"
Issues = "https://github.com/Nijjea1/hotpath/issues"
Changelog = "https://github.com/Nijjea1/hotpath/blob/main/CHANGELOG.md"

[project.scripts]
hotpath = "hotpath.cli:main"

[tool.setuptools.packages.find]
include = ["hotpath*", "server*"]

[tool.setuptools.package-data]
server = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: end-to-end runs of the whole `go` flow (minutes); `make test-fast` skips them, CI runs them"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Fixture targets are excluded on purpose: their locked files and recorded mock patches must stay
# byte-for-byte what the patches were written against.
extend-exclude = ["site", "workspaces", "build", ".tmp", "submission", "demo_repo", "targets", "examples"]

[tool.ruff.lint]
# Correctness, not style: pyflakes, pycodestyle errors, bugbear, pylint errors, stale noqa.
# The compact one-line `if x: return` / `a; b` idiom used throughout is deliberate (E701/E702).
select = ["E4", "E7", "E9", "F", "W6", "B", "PLE", "RUF100"]
ignore = ["E701", "E702", "E741"]
