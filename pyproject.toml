[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotpath"
version = "0.1.0"
description = "An AI agent that makes code faster and proves every change is correct."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "openai>=1.40",
  "sentry-sdk[fastapi]>=2.69.2,<3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
torch = ["torch>=2.2"]

[project.scripts]
hotpath = "hotpath.cli:main"

[tool.setuptools.packages.find]
include = ["hotpath*", "server*"]

[tool.setuptools.package-data]
server = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
