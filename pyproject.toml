[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hotpath"
version = "0.1.0"
description = "An AI agent that makes code faster and proves every change is correct."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hotpath contributors" }]
keywords = ["performance", "profiling", "benchmarking", "ai", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "openai>=1.40",
  "sentry-sdk[fastapi]>=2.69.2,<3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "build>=1.2"]
torch = ["torch>=2.2"]

[project.urls]
Homepage = "https://github.com/Nijjea1/hotpath"
Repository = "https://github.com/Nijjea1/hotpath"
Issues = "https://github.com/Nijjea1/hotpath/issues"

[project.scripts]
hotpath = "hotpath.cli:main"

[tool.setuptools.packages.find]
include = ["hotpath*", "server*"]

[tool.setuptools.package-data]
server = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
