name: tests

on:
  push:                 # every branch, not just main: an unmerged branch that never builds is how
  pull_request:         # 2,900 lines once reached `origin` without a single CI run
  workflow_dispatch:

# A new push supersedes the one before it; `pull_request` also covers forks, whose pushes we
# never see, so a PR from this repo costs one extra run and an outside contributor still gets CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-platforms:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The harness creates git worktrees and commits in temporary repos, which
      # needs an identity that a fresh runner does not have.
      - name: Configure git
        run: |
          git config --global user.name "hotpath ci"
          git config --global user.email "ci@hotpath.invalid"
          git config --global init.defaultBranch main

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Docker-backed and browser-backed tests skip themselves unless
      # HOTPATH_TEST_DOCKER=1 / node+playwright are present; everything else,
      # including the full offline loop on demo_repo, runs here.
      - name: Test
        run: pytest -q

  pytest-python:
    name: pytest (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Configure git
        run: |
          git config --global user.name "hotpath ci"
          git config --global user.email "ci@hotpath.invalid"
          git config --global init.defaultBranch main
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Smoke-test the wheel outside the source tree
        run: |
          python -m venv /tmp/hotpath-wheel
          /tmp/hotpath-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/hotpath-wheel/bin/hotpath --help
          /tmp/hotpath-wheel/bin/hotpath doctor --json

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci --prefix site
      - run: site/node_modules/.bin/playwright-core install --with-deps chromium
      - name: Real Chromium dashboard regression
        env:
          HOTPATH_PLAYWRIGHT_MODULE: ${{ github.workspace }}/site/node_modules/playwright-core
        run: pytest -q tests/test_dashboard_browser.py

  docker-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Configure git
        run: |
          git config --global user.name "hotpath ci"
          git config --global user.email "ci@hotpath.invalid"
          git config --global init.defaultBranch main
      - run: pip install -e ".[dev]"
      - run: docker build -t hotpath-runner:local -f docker/Dockerfile .
      - name: Exercise the real no-network, read-only container boundary
        env:
          HOTPATH_TEST_DOCKER: "1"
        run: pytest -q tests/test_isolation.py::test_real_docker_boundary
